name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a dist/e4mc-tunnel-${GITHUB_REF_NAME}-${RUNNER_OS}-x86_64.zip ./target/release/e4mc-tunnel.exe
          else
            tar czf dist/e4mc-tunnel-${GITHUB_REF_NAME}-${RUNNER_OS}-x86_64.tar.gz -C target/release e4mc-tunnel
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Android binaries
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../dist build --release
        working-directory: e4mc-tunnel
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: Package binaries
        run: |
          mkdir -p dist-pkg
          tar czf dist-pkg/e4mc-tunnel-${GITHUB_REF_NAME}-Android-aarch64.tar.gz -C dist arm64-v8a/e4mc-tunnel
          tar czf dist-pkg/e4mc-tunnel-${GITHUB_REF_NAME}-Android-armv7.tar.gz -C dist armeabi-v7a/e4mc-tunnel
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: dist-pkg/*
          if-no-files-found: error

  publish:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate checksums
        run: find dist -type f -and -name 'e4mc-tunnel*' -exec sha256sum {} \; | sed 's|dist/release-[^/]*/||' > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            Rust-клиент туннеля e4mc для Minecraft Horizon. Запуск: `./e4mc-tunnel --port <порт мира Horizon>` — в консоли появится адрес вида `xxx.e4mc.link`, который вводят друзья в мультиплеере. Работает без VPN, VPS, белого IP и проброса портов.

            The Rust e4mc tunnel client for Minecraft Horizon. Extract and run `./e4mc-tunnel --port <Horizon world port>`; the console prints a public `xxx.e4mc.link` address your friends join — no VPN, VPS, white IP or port forwarding needed.

            ### Android
            - `Android-aarch64` — современные телефоны (arm64-v8a)
            - `Android-armv7` — старые 32-битные телефоны (armeabi-v7a)
            Распакуйте и запустите бинарь в терминале (Termux или adb shell).

            Idea, protocol and relay infrastructure are the original e4mc project; this repository is only a Rust client adaptation.
          files: |
            SHA256SUMS.txt
            dist/release-Linux/*
            dist/release-Windows/*
            dist/release-Android/*
